<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAX Montañismo GT | Expediciones & Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #111111;
            --bg-card-hover: #181818;
            --cyan-neon: #00E5FF;
            --cyan-glow: rgba(0, 229, 255, 0.2);
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        header {
            background-color: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--cyan-neon);
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--cyan-neon);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 5rem 0 1rem 0;
            letter-spacing: -0.5px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 3rem;
            font-size: 1rem;
        }

        /* Hero Section */
        .hero {
            padding: 6rem 1.5rem 4rem 1.5rem;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05) 0%, rgba(5, 5, 5, 1) 70%);
        }

        .mascot-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #0d0d0d;
            border: 1px solid var(--cyan-neon);
            box-shadow: 0 0 15px var(--cyan-glow);
            border-radius: 50px;
            padding: 0.5rem 1.2rem;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--cyan-neon);
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.2rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto 2.5rem auto;
        }

        .btn-cta {
            display: inline-block;
            background-color: var(--cyan-neon);
            color: #000;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 0 20px var(--cyan-glow);
            transition: all 0.3s;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .about-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .about-card h3 {
            color: var(--cyan-neon);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        /* CMI Sub-section */
        .cmi-container {
            background: linear-gradient(145deg, #0d0d0d, #141414);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            margin-top: 2rem;
        }

        .cmi-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .cmi-header h3 {
            font-size: 1.6rem;
            color: var(--text-main);
        }

        .cmi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .cmi-item {
            border-left: 3px solid var(--cyan-neon);
            padding-left: 1rem;
        }

        .cmi-item h4 {
            color: var(--cyan-neon);
            font-size: 1rem;
            margin-bottom: 0.4rem;
        }

        .cmi-item p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Cards Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--cyan-neon);
            background-color: var(--bg-card-hover);
            transform: translateY(-4px);
        }

        .card-header h3 {
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
        }

        .date-tag {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .price-tag {
            font-size: 1.5rem;
            color: var(--cyan-neon);
            font-weight: 800;
            margin: 1rem 0;
        }

        .btn-card {
            display: block;
            text-align: center;
            background: transparent;
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            padding: 0.65rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-card:hover {
            background-color: var(--cyan-neon);
            color: #000;
        }

        /* Past Trips Grid */
        .past-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }

        .past-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
